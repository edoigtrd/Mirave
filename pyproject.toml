[project]
name = "mirave"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.32.0",
    "peft>=0.21.0",
    "pyarrow>=25.0.1",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typesafe-sdk>=0.7.1",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
